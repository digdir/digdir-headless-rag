      operationId: updateOperatorDataset
      security:
        - JwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetRequest'
      responses:
        '200':
          description: Updated dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorDatasetResponse'
