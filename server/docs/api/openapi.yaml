openapi: 3.0.3
info:
  title: Digdir RAG API
  description: |
    Retrieval-Augmented Generation API for querying Norwegian government documents.

    ## Authentication

    The Public API uses API keys, passed either in the `X-API-Key` header
    or as `Authorization: Bearer <key>`. The two are equivalent on every
    public endpoint; the Bearer form exists so OpenAI clients work against
    the `/v1` surface unchanged.
    Internal Operator Console APIs use JWT authentication via cookie.

    Public APIs are dataset-oriented and read-only with respect to dataset and pipeline state.
    Pipeline mutation and execution remain Operator Console concerns.

    ## Rate Limiting

    Authentication endpoints are rate limited to 10 requests per 15 minutes per IP.

    ## How much of this file is checked against the server

    Other documents call this file the authoritative contract. Some of it is
    checked against the running server and most of it is not, and the difference
    is not visible from reading it — so it is stated here rather than assumed.

    **Checked automatically**, by `digdir.api.doc-fidelity-test`:

    - request bodies and query parameters, field for field, against the route
      schemas the server coerces with (`digdir.api.request-doc-drift-test`)
    - **endpoint existence**, both directions: every `/api/*` and `/v1/*` route
      the server serves has an entry here, and every path here is served. The
      public surface has no exceptions. Six Operator Console routes are served
      and absent, enumerated in a register rather than excused by a prefix, so
      a *new* console route still fails — see #369
    - every documented 2xx declares a response shape, and that shape resolves
      (`digdir.api.response-schema-coverage-test`)
    - documented response EXAMPLES against what handlers emit, for the four
      conversation endpoints (key sets) and for `GET /v1/models`,
      `GET /api/datasets` and one documented 404 body (key sets **and value
      types**) — `digdir.api.doc-fidelity-smoke-test`
    - the **`schema` blocks in this file** against what handlers emit, by
      property NAME, one level into arrays, for `GET /v1/models`,
      `GET /api/datasets` and `GET /api/conversations`
      (`openapi-response-schemas-match-what-handlers-emit` in
      `digdir.api.doc-fidelity-smoke-test`). This is the schema side, distinct
      from the EXAMPLE check above: it found `_skill_graph` declared against an
      emitted `_mode` on its first run (#375). The schema drives the
      comparison, so a handler that stops emitting a declared field fails
      rather than removing its own comparison, and a `$ref` that resolves to
      nothing fails rather than reading as agreement
    - for `/api/mcp` only: that the supported-method list names
      `server/discover` and not `initialize`, and that a JSON-RPC notification
      is documented with the status the transport actually returns
    - for `/api/mcp` only: that the **method list** — the `Mcp-Method` enum *and*
      the "Supported methods" sentence — matches what `digdir.mcp.transport`
      actually routes, in both directions (#368)
    - for `/api/mcp` only: that the **request-metadata header parameters** are
      exactly the three `digdir.mcp.transport/request-metadata-contract`
      enforces — in both directions, so a header declared here but not read by
      the server fails as loudly as one the server requires and this file omits
      — plus their required-ness and, where the contract fixes a value set,
      their `enum`

    **Not checked, and hand-maintained** — including parts of `/api/mcp` that
    the header guard above does *not* reach:

    - which METHODS a client may call is checked; what each method DOES is not.
      The names agree with `dispatch`; that `tools/call` behaves as described is
      unverified by anything here.
    - that `Mcp-Name` is required only for `tools/call`. OpenAPI cannot express
      a conditionally required parameter, so it is declared `required: false`
      and the condition lives in a description nothing reads.
    - the `initialize` rejection, which is a method-level rule deliberately
      outside the header contract, and the body-path precedence the contract
      carries for each header
    - that the JSON-RPC error codes named in prose are the ones returned
    - that a declared response schema matches what its handler emits, for every
      endpoint EXCEPT the three named in the checked list above and the
      Pipeline detail response. The three that are checked compare property
      NAMES only: a schema and a handler can still disagree here on type,
      nullability, required-ness or enum and nothing notices.
      `POST`/`PUT`/`DELETE` responses are unchecked from the schema side
      entirely, and so is every 4xx/5xx schema
    - **response correctness**, which the example checks above do not amount to.
      They compare key sets and value types one level into arrays. Nullability,
      deeper nesting, value semantics, and any array the server returns empty
      are all still open after they pass — `/api/datasets` is in that last
      category today, so its envelope is checked and the dataset object inside
      it is not
    - `/v1/chat/completions` and `/api/mcp` `tools/call` results, which need a
      live model and a materialized dataset, and the whole `/console-api`
      surface, which needs an operator JWT. **These are the highest-traffic
      responses on the API and they are the least checked** — the coverage is
      thinnest exactly where it would matter most
    - what a documented endpoint MEANS. Existence is checked and inputs are
      checked; that an operation does what its summary says is not, and cannot
      be from route data alone
    - the Operator Console surface's completeness, which is partial by register
      rather than by rule — `/console-api/users/{id}/permissions` is documented
      while `/console-api/users/{id}` is not, so that section implies a
      completeness it does not have (#369)
    - descriptions, examples and every English sentence in this file

    A correction to one operation is not a warranty over the rest. If a claim
    here matters to your client, the server is the authority — see
    `server/docs/api/endpoints/` for the surfaces with hand-written references.
  version: 1.0.0
  contact:
    name: Digdir Support

servers:
  - url: https://admin.kunnskap.digdir.cloud
    description: Production
  - url: https://admin.staging.kunnskap.digdir.cloud
    description: Staging

tags:
  - name: MCP
    description: |
      Model Context Protocol server. JSON-RPC 2.0 over Streamable HTTP.
      Full reference at [endpoints/mcp.md](./endpoints/mcp.md).
  - name: OpenAI-compatible
    description: |
      OpenAI-compatible `/v1` surface. Each agent is exposed as a model so
      any OpenAI client can talk to it unchanged. Full reference at
      [endpoints/openai-compat.md](./endpoints/openai-compat.md).
  - name: Datasets
    description: Public read-only dataset state
  - name: Conversations
    description: Conversation management
  - name: Pipelines
    description: Operator Console dataset and pipeline management
  - name: API Keys
    description: Operator Console API key management

security:
  - ApiKeyAuth: []

paths:
  /api/mcp:
    post:
      tags:
        - MCP
      summary: MCP JSON-RPC endpoint
      description: |
        Model Context Protocol server, revision `2026-07-28` and only that
        revision. Accepts a single JSON-RPC 2.0 envelope per request.
        Supported methods: `server/discover`, `tools/list`, `tools/call`,
        `ping`.

        `server/discover` is mandatory in this revision and replaces the
        handshake: it returns the supported versions, capabilities, server
        identity and usage instructions in one round trip. There is no
        `initialize` and no `notifications/initialized` — this revision has
        no handshake and no session, so a request for `initialize` is
        answered `400` with `-32022` naming the versions we speak.

        Every request must carry the three request-metadata headers below,
        mirrored from the body. The mirroring exists so an intermediary can
        route on the header while the server executes on the body, which is
        why a header that disagrees with the body is rejected rather than
        ignored.

        `tools/call` responses are plain JSON unless the request includes
        a `_meta.progressToken`, in which case the response opens as
        `text/event-stream` and streams `notifications/progress` frames
        terminated by the final JSON-RPC result frame.

        Per-API-key rate limited (120 requests / 60s by default; 429
        on overflow). See [endpoints/mcp.md](./endpoints/mcp.md) for
        the full protocol — OpenAPI cannot express JSON-RPC unions or
        SSE responses without losing fidelity.
      operationId: mcpJsonRpc
      security:
        - ApiKeyAuth: []
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: true
          description: >-
            The MCP revision this request is made under. Must be `2026-07-28`;
            any other value is refused with `400` and `-32022` listing what we
            support. Mirrors `params._meta["io.modelcontextprotocol/protocolVersion"]`
            when the body carries it — the body field is optional, this header is not.
          schema:
            type: string
            enum: ['2026-07-28']
        - name: Mcp-Method
          in: header
          required: true
          description: >-
            Mirrors the `method` field of the body. A value that disagrees with
            the body is refused with `400` and `-32020`.
          schema:
            type: string
            enum: ['server/discover', 'tools/list', 'tools/call', 'ping']
        - name: Mcp-Name
          in: header
          required: false
          description: >-
            Required for `tools/call`, where it mirrors `params.name`; not sent
            for other methods. A value that disagrees with the body is refused
            with `400` and `-32020`. Values outside plain ASCII are wrapped as
            `=?base64?<b64>?=` and decoded before comparison.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: |
            JSON-RPC response (success or error) for blocking calls,
            or the opening of an `text/event-stream` for streaming
            `tools/call`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames carrying JSON-RPC notifications/progress
                  and a final JSON-RPC result frame.
        '202':
          description: |
            Accepted, with no body — returned for a JSON-RPC notification
            (a request carrying no `id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '400':
          description: |
            The request never became a tool call. Carries a JSON-RPC error:
            `-32020` (`HeaderMismatch`) for a missing or contradicting
            request-metadata header, `-32022`
            (`UnsupportedProtocolVersionError`) for an unsupported version or
            for a legacy `initialize`, `-32602` for an unknown tool or agent,
            and `-32700` for an unparseable body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '401':
          description: Missing or invalid API key.
        '404':
          description: |
            Unknown JSON-RPC method, with `-32601` and the method name in
            `error.data.method`. The non-2xx status is required: a JSON-RPC
            error inside a `200` is what a dual-era client reads as a legacy
            server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '429':
          description: Per-API-key rate limit exceeded.
    get:
      tags:
        - MCP
      summary: Not allowed — the MCP endpoint accepts POST only
      description: >-
        `GET` belonged to the pre-`2026-07-28` transport, where it opened the
        standalone SSE stream. That stream no longer exists. Answered `405`
        rather than `404` so a client can tell "wrong verb" from
        "wrong endpoint".
      operationId: mcpGetNotAllowed
      security:
        - ApiKeyAuth: []
      responses:
        '405':
          description: "Method Not Allowed, with an `Allow: POST` header."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
    delete:
      tags:
        - MCP
      summary: Not allowed — the MCP endpoint accepts POST only
      description: >-
        `DELETE` belonged to the pre-`2026-07-28` transport, where it
        terminated a protocol session. This revision has no sessions.
        Answered `405` for the same reason as `GET`.
      operationId: mcpDeleteNotAllowed
      security:
        - ApiKeyAuth: []
      responses:
        '405':
          description: "Method Not Allowed, with an `Allow: POST` header."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'

  /v1/models:
    get:
      tags:
        - OpenAI-compatible
      summary: List models
      description: |
        One model per (agent × allowed skill graph) pair visible to the
        authenticated key — the same surface MCP exposes as tools. Model
        ids have the form `<agent-id>__<skill-graph-short-name>`; the
        `_default` flag marks the agent's default graph.
      operationId: listModels
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Model list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          description: Missing or invalid API key.

  /v1/chat/completions:
    post:
      tags:
        - OpenAI-compatible
      summary: Chat completion
      description: |
        OpenAI-compatible chat completion against a digdir agent.

        The agent needs a dataset scope, and a stock OpenAI body has no
        field for one. Supply it via the API key's dataset scopes, via the
        `tenant` + `dataset_config_key` extension fields below, or via the
        server's `TENANT` / `DATASET_CONFIG_KEY` environment defaults.
        With none of them the call returns `400` with code
        `no_dataset_scope`. Where the key HAS dataset scopes, the
        `tenant` + `dataset_config_key` fields select among them and
        cannot exceed them — naming a dataset outside the grant returns
        `403` with code `dataset_not_authorized`.

        Sampling parameters are accepted and ignored; generation settings
        come from the agent's configuration. `stream: true` returns SSE
        frames terminated by `data: [DONE]` — currently one content delta
        rather than per-token streaming.

        Per-API-key rate limited (120 requests / 60s by default).
      operationId: createChatCompletion
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            Chat completion, or the opening of a `text/event-stream` when
            `stream` is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames carrying `chat.completion.chunk` objects,
                  terminated by `data: [DONE]`.
        '400':
          description: |
            Bad request — `missing_model`, `missing_messages`,
            `invalid_messages`, or `no_dataset_scope`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiError'
        '401':
          description: Missing or invalid API key.
        '403':
          description: |
            Agent or skill graph not permitted for this key, agent
            disabled, or `dataset_not_authorized` — the named dataset is
            outside this key's granted dataset scopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiError'
        '404':
          description: Unknown model, agent, skill graph, or dataset — including when no datasets are configured yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiError'
        '429':
          description: Per-API-key rate limit exceeded.
        '500':
          description: The agent errored while answering (`invoke_failed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiError'

  /api/runtime/config/resolve:
    post:
      tags:
        - Datasets
      summary: Resolve runtime configuration
      description: |
        Resolve one or more runtime config paths for a tenant. Documented from
        the accepting schema in #177 — the endpoint predates its entry here.
      operationId: resolveRuntimeConfig
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRuntimeConfigRequest'
      responses:
        '200':
          description: Resolved configuration values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigResolveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid API key.

  /api/dataset/config/resolve:
    post:
      tags:
        - Datasets
      summary: Resolve dataset configuration
      description: |
        Resolve one or more dataset config paths. Identify the dataset by
        `dataset-id`, by `dataset-ref`, or by `tenant` + `dataset-config-key`.
        Documented from the accepting schema in #177.
      operationId: resolveDatasetConfig
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDatasetConfigRequest'
      responses:
        '200':
          description: Resolved configuration values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetConfigResolveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid API key.

  /api/skills/{id}/execute:
    post:
      tags:
        - Datasets
      summary: Execute a skill
      description: |
        Execute a single skill by id. Documented from the accepting schema in
        #177. For agent invocation use [`/api/mcp`](./endpoints/mcp.md) or the
        OpenAI-compatible `/v1` surface instead.
      operationId: executeSkill
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Skill identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteSkillRequest'
      responses:
        '200':
          description: Skill output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillExecutionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid API key.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/config/{root}/nodes:
    get:
      tags:
        - Configuration
      summary: List Config Nodes
      description: >-
        List the configuration nodes under a config root for a tenant.
        Documented as part of #267 — it was reachable and accepting a required
        query parameter with no entry in this spec at all, so a caller had
        nothing to work from and an omitted `tenant` produced a 400 they could
        not explain.
      operationId: listConfigNodes
      security:
        - ApiKeyAuth: []
      parameters:
        - name: root
          in: path
          required: true
          description: Config root to list nodes for
          schema:
            type: string
        - name: tenant
          in: query
          required: true
          description: Tenant whose config nodes to list
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                # Derived from list-config-nodes-handler's response-data and
                # public-node-summary, not copied from a neighbour.
                type: object
                properties:
                  root:
                    type: string
                  tenant:
                    type: string
                  allowed-config-keys:
                    type: array
                    items:
                      type: string
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        config-key:
                          type: string
                        label:
                          type: string
                        enabled?:
                          type: boolean
                        parent-node-id:
                          type: string
                          description: Present only when the node has a parent
                        parent-config-key:
                          type: string
                          description: Present only when the node has a parent
        '400':
          description: Missing or invalid query parameters.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/conversations:
    get:
      tags:
        - Conversations
      summary: List Conversations
      description: Get a paginated list of conversations.
      operationId: listConversations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page_size
          in: query
          description: Number of conversations per page
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: page_index
          in: query
          description: Page number (0-indexed)
          schema:
            type: integer
            default: 0
        - name: tags
          in: query
          description: Optional comma-separated tags; conversations must include all listed tags
          schema:
            type: string
        - name: X-User-Id
          in: header
          required: true
          description: Opaque external caller identifier used only for conversation scoping
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Conversations
      summary: Create Conversation
      description: Create a new conversation.
      operationId: createConversation
      security:
        - ApiKeyAuth: []
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: Opaque external caller identifier used only for conversation scoping
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Conversation ID
        schema:
          type: string
      - name: X-User-Id
        in: header
        required: true
        description: Opaque external caller identifier used only for conversation scoping
        schema:
          type: string

    get:
      tags:
        - Conversations
      summary: Get Conversation
      description: Get a specific conversation with all its messages.
      operationId: getConversation
      parameters:
        - name: include_diagnostics
          in: query
          required: false
          description: Include normalized stored message diagnostics when available
          schema:
            type: boolean
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationWithMessages'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Conversations
      summary: Update Conversation
      description: Update a conversation (e.g., rename).
      operationId: updateConversation
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: Conversation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Conversations
      summary: Delete Conversation
      description: Delete a conversation and all its messages.
      operationId: deleteConversation
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Conversation deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/datasets:
    get:
      tags:
        - Datasets
      summary: List Visible Datasets
      description: List the datasets visible to the current API key through its dataset scopes.
      operationId: listDatasets
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDatasetListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/datasets/{dataset-id}:
    parameters:
      - name: dataset-id
        in: path
        required: true
        description: Canonical globally unique dataset ID
        schema:
          type: string
    get:
      tags:
        - Datasets
      summary: Get Visible Dataset
      description: Return one visible dataset.
      operationId: getDataset
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDatasetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /console-api/permissions:
    get:
      tags:
        - API Keys
      summary: List available permissions
      description: >-
        Every permission that can be granted to a user. Documented from
        `list-permissions-handler` in #369.
      operationId: listOperatorPermissions
      security:
        - JwtAuth: []
      responses:
        '200':
          description: Permissions listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /console-api/access-policies:
    get:
      tags:
        - API Keys
      summary: List access policies
      description: >-
        Access policies visible to the authenticated operator. Documented from
        `list-access-policies-handler` in #369.
      operationId: listAccessPolicies
      security:
        - JwtAuth: []
      responses:
        '200':
          description: Access policies listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /console-api/api-keys/{key-id}/rotate:
    post:
      tags:
        - API Keys
      summary: Rotate an API key
      description: >-
        Issues a replacement key and returns the new plaintext **once**. Only
        the operator who created the key may rotate it. Documented from
        `rotate-api-key-handler` in #369.
      operationId: rotateApiKey
      security:
        - JwtAuth: []
      parameters:
        - name: key-id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Key rotated. The plaintext is not retrievable again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateApiKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The key was created by a different operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /console-api/conversations:
    get:
      tags:
        - Conversations
      summary: List Conversations (operator console)
      description: >-
        Operator-console listing of conversations across callers. Accepts the
        same pagination parameters as `GET /api/conversations` but is a
        distinct endpoint — documented under #267, where its absence from this
        spec was nearly missed because those parameter names ARE documented,
        under the other path.
      operationId: adminListConversations
      parameters:
        - name: page_size
          in: query
          description: Number of conversations per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: page_index
          in: query
          description: Page number (0-indexed)
          schema:
            type: integer
            minimum: 0
        - name: tags
          in: query
          description: Optional comma-separated tags; conversations must include all listed tags
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                # Same shape as GET /api/conversations because both handlers
                # call the SAME formatter — conversations/format-conversation-list-response.
                # Shared because the producer is shared, not because the
                # endpoints look alike.
                $ref: '#/components/schemas/ConversationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /console-api/api-keys:
    get:
      tags:
        - API Keys
      summary: List API Keys
      description: List all API keys for the authenticated user.
      operationId: listApiKeys
      security:
        - JwtAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - API Keys
      summary: Create API Key
      description: |
        Create a new API key. The key is only returned once in the response.
        Store it securely as it cannot be retrieved again.
      operationId: createApiKey
      security:
        - JwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            example:
              name: "Public Docs Integration"
              dataset-scopes:
                - tenant: "digdir"
                  dataset-config-key: "public-docs"
              allowed-config-keys:
                - root: "dataset"
                  tenant: "digdir"
                  dataset-config-key: "public-docs"
                - root: "runtime"
                  tenant: "digdir"
                  runtime-config-key: "default"
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
              example:
                api-key-id: "key_abc123"
                api-key: "rag_abcdefghijklmnopqrstuvwxyz"
                name: "Public Docs Integration"
                dataset-scopes:
                  - tenant: "digdir"
                    dataset-config-key: "public-docs"
                allowed-config-keys:
                  - root: "dataset"
                    tenant: "digdir"
                    dataset-config-key: "public-docs"
                  - root: "runtime"
                    tenant: "digdir"
                    runtime-config-key: "default"
                warning: "This is the only time you will see this API key. Store it securely."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /console-api/api-keys/{key-id}/allowed-config-keys:
    put:
      tags:
        - API Keys
      summary: Replace API Key Allowed Config Keys
      description: Replace the config-management allowed config keys for an API key owned by the authenticated user.
      operationId: updateApiKeyAllowedConfigKeys
      security:
        - JwtAuth: []
      parameters:
        - name: key-id
          in: path
          required: true
          description: API key ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyAllowedConfigKeysRequest'
            example:
              allowed-config-keys:
                - root: "platform"
                  tenant: "digdir"
                  platform-config-key: "default"
                - root: "runtime"
                  tenant: "digdir"
                  runtime-config-key: "default"
                - root: "dataset"
                  tenant: "digdir"
                  dataset-config-key: "public-docs"
      responses:
        '200':
          description: API key allowed config keys updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyAllowedConfigKeysResponse'
              example:
                api-key-id: "key_abc123"
                name: "Public Docs Integration"
                allowed-config-keys:
                  - root: "platform"
                    tenant: "digdir"
                    platform-config-key: "default"
                  - root: "runtime"
                    tenant: "digdir"
                    runtime-config-key: "default"
                  - root: "dataset"
                    tenant: "digdir"
                    dataset-config-key: "public-docs"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not authorized to update this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /console-api/api-keys/{key-id}/revoke:
    post:
      tags:
        - API Keys
      summary: Revoke API Key
      description: Revoke an API key. This action cannot be undone.
      operationId: revokeApiKey
      security:
        - JwtAuth: []
      parameters:
        - name: key-id
          in: path
          required: true
          description: API key ID
          schema:
            type: string
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not authorized to revoke this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /console-api/users:
    get:
      tags:
        - API Keys
      summary: List users
      description: >-
        Every user with their granted permissions. Documented from
        `list-users-handler` in #369.
      operationId: listOperatorUsers
      security:
        - JwtAuth: []
      responses:
        '200':
          description: Users listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - API Keys
      summary: Create a user
      description: Documented from the accepting schema in #177.
      operationId: createOperatorUser
      security:
        - JwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /console-api/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - API Keys
      summary: Get a user
      description: One user with their permissions. Documented from `get-user-handler` in #369.
      operationId: getOperatorUser
      security:
        - JwtAuth: []
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - API Keys
      summary: Delete a user
      description: >-
        Deletes the user. Refuses with `400` when the caller targets their own
        account. Documented from `delete-user-handler` in #369.
      operationId: deleteOperatorUser
      security:
        - JwtAuth: []
      responses:
        '200':
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /console-api/users/{id}/permissions:
    put:
      tags:
        - API Keys
      summary: Update a user's permissions
      description: |
        Add and/or remove permissions. Both fields are optional; sending
        neither is a no-op. Documented from the accepting schema in #177.
      operationId: updateOperatorUserPermissions
      security:
        - JwtAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPermissionsRequest'
      responses:
        '200':
          description: Updated permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /console-api/datasets:
    get:
      tags:
        - Pipelines
      summary: List Datasets
      description: List durable parent datasets in the Operator Console.
      operationId: listOperatorDatasets
      security:
        - JwtAuth: []
      responses:
        '200':
          description: Successful response
