components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        The same API key as `ApiKeyAuth`, sent as `Authorization: Bearer
        <key>`. Accepted on every public endpoint; required in practice by
        OpenAI clients, which send this header on their own.
    JwtAuth:
      type: apiKey
      in: cookie
      name: auth-token
      description: JWT token in HTTP-only cookie

  schemas:
    # OpenAI-compatible /v1 — mirrors OpenAI's own shapes so existing
    # clients validate. See endpoints/openai-compat.md.
    ModelList:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    Model:
      type: object
      properties:
        id:
          type: string
          description: '`<agent-id>__<skill-graph-short-name>`'
          example: builtin.agent-rag-agent__agent-rag-graph-bundled
        object:
          type: string
          example: model
        created:
          type: integer
          description: Unix seconds.
        owned_by:
          type: string
          example: digdir-rag
        description:
          type: string
        _agent_id:
          type: string
          description: digdir extension — the underlying agent id.
        _mode:
          type: string
          description: >-
            digdir extension — the mode's short name, unqualified: the half
            after `__` in the model id. Was `_skill_graph` until the
            public-identifiers ADR took the word "skill" off the wire (#122);
            the handler and `openai-compat.md` renamed and this schema did not,
            which is what `openapi-response-schemas-match-what-handlers-emit`
            now catches.
        _default:
          type: boolean
          description: digdir extension — present when this is the agent's default graph.
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: An `id` from `/v1/models`.
          example: builtin.agent-rag-agent__agent-rag-graph-bundled
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: |
            The last `user` message is the query; earlier turns become
            conversation history.
        stream:
          type: boolean
          default: false
          description: Return `text/event-stream` instead of JSON.
        tenant:
          type: string
          description: |
            digdir extension. With `dataset_config_key`, selects the
            dataset scope for this call, picking among the scopes the API
            key allows. Both fields are required together.
          example: digdir
        dataset_config_key:
          type: string
          description: digdir extension — see `tenant`.
          example: public-docs
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
    ChatCompletion:
      type: object
      properties:
        id:
          type: string
          example: chatcmpl-GchQMEUfrQ2MRhlUxtNVS
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
                example: stop
        usage:
          type: object
          description: |
            Present for compatibility; digdir does not meter tokens and
            reports zeros.
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
        citations:
          type: array
          description: |
            digdir extension — Perplexity-style list of source URLs.
            Present only when the agent produced citations.
          items:
            type: string
        sources:
          type: array
          description: |
            digdir extension — Open WebUI's native source shape, rendered
            as clickable references. Present only when the agent produced
            citations.
          items:
            type: object
            properties:
              source:
                type: object
                properties:
                  name:
                    type: string
                  url:
                    type: string
              document:
                type: array
                items:
                  type: string
    OpenAiError:
      type: object
      description: |
        OpenAI's error envelope, used by `/v1` for its own errors. Note
        that a 401 comes from shared auth middleware instead and returns
        `{"error": "<string>"}` — branch on the status code.
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              example: invalid_request_error
            code:
              type: string
              example: no_dataset_scope

    # MCP — minimal JSON-RPC schemas. The real wire shape varies per
    # method; see endpoints/mcp.md for full descriptions.
    JsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
          description: Omit for notifications.
        method:
          type: string
          enum:
            - initialize
            - tools/list
            - tools/call
            - ping
            - notifications/initialized
        params:
          type: object
          additionalProperties: true
    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
              additionalProperties: true

    # Request Schemas
    # RagRequest and RetrieveRequest were removed when /api/rag and
    # /api/retrieve were hard-deleted in Phase 0 of the MCP migration.
    # Equivalent MCP tool call arguments are documented in
    # endpoints/mcp.md.

    ResolveRuntimeConfigRequest:
      type: object
      description: |
        Identify the runtime config to resolve. `tenant` and
        `runtime-config-key` are required; the rest narrow the lookup.
        Give either `path` or `paths`.
      required:
        - tenant
        - runtime-config-key
      properties:
        tenant:
          type: string
        runtime-config-key:
          type: string
        agent-id:
          type: string
        agent:
          type: string
        dataset-id:
          type: string
        dataset-config-key:
          type: string
        dataset-ref:
          $ref: '#/components/schemas/DatasetScope'
        path:
          type: string
          description: A single config path to resolve
        paths:
          type: array
          items:
            type: string
          description: Several config paths to resolve

    ResolveDatasetConfigRequest:
      type: object
      description: |
        Identify the dataset by `dataset-id`, by `dataset-ref`, or by `tenant`
        plus `dataset-config-key`. Every field is optional in the schema; the
        handler rejects a request that identifies nothing.
      properties:
        tenant:
          type: string
        dataset-id:
          type: string
        dataset-config-key:
          type: string
        dataset-ref:
          $ref: '#/components/schemas/DatasetScope'
        path:
          type: string
        paths:
          type: array
          items:
            type: string

    ExecuteSkillRequest:
      type: object
      required:
        - inputs
      properties:
        inputs:
          description: Skill inputs; shape depends on the skill
        parameters:
          description: Optional per-call skill parameters
        tenant:
          type: string
        dataset-config-key:
          type: string
        dataset-ref:
          $ref: '#/components/schemas/DatasetScope'

    CreateUserRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
        permissions:
          type: array
          items:
            type: string

    UpdateUserPermissionsRequest:
      type: object
      description: Both fields optional; sending neither is a no-op.
      properties:
        add:
          type: array
          items:
            type: string
        remove:
          type: array
          items:
            type: string

    UpdateDatasetRequest:
      type: object
      description: All fields optional.
      properties:
        name:
          type: string
        description:
          type: string
        enabled?:
          type: boolean

    CreateConversationRequest:
      type: object
      properties:
        agent-id:
          type: string
          description: |
            Agent the conversation belongs to. Accepted since the conversation
            model became agent-scoped; documented here from #177.
        title:
          type: string
          description: Optional conversation title
        filterValue:
          type: object
          description: Optional filter for the conversation
        tags:
          type: array
          items:
            type: string
          description: Optional conversation tags

    UpdateConversationRequest:
      type: object
      properties:
        title:
          type: string
          description: New conversation title
        tags:
          type: array
          items:
            type: string
          description: Replace the conversation tag set

    CreateDatasetRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    CreateApiKeyRequest:
      type: object
      description: |
        `name` is required, plus **one of** `dataset-scopes` or `policy-id` —
        a key with neither is rejected. That either/or is not expressible in
        `required`, so only `name` is listed there.

        Two names are rejected with a 400 rather than ignored:
        `skill-graphs` (renamed to `modes`) and `scopes` (never settable
        here). Both used to be accepted and silently dropped.
      required:
        - name
      properties:
        name:
          type: string
          description: Human-readable name for the key
          example: "Production Integration"
        dataset-scopes:
          type: array
          items:
            $ref: '#/components/schemas/DatasetScope'
          description: Datasets the key will be scoped to
        policy-id:
          type: string
          description: Access policy to inherit grants from, instead of listing dataset-scopes
        allowed-config-keys:
          type: array
          items:
            $ref: '#/components/schemas/AllowedConfigKey'
        client-id:
          type: string
        agent-refs:
          type: array
          items:
            type: string
        modes:
          type: array
          description: >-
            Namespaced mode ids this key may invoke,
            e.g. `builtin/agent-rag-graph-bundled`.
          items:
            type: string

    UpdateApiKeyAllowedConfigKeysRequest:
      type: object
      required:
        - allowed-config-keys
      properties:
        allowed-config-keys:
          type: array
          items:
            $ref: '#/components/schemas/AllowedConfigKey'

    DatasetScope:
      type: object
      required:
        - tenant
        - dataset-config-key
      properties:
        tenant:
          type: string
        dataset-config-key:
          type: string

    AllowedConfigKey:
      oneOf:
        - $ref: '#/components/schemas/PlatformAllowedConfigKey'
        - $ref: '#/components/schemas/RuntimeAllowedConfigKey'
        - $ref: '#/components/schemas/DatasetAllowedConfigKey'

    PlatformAllowedConfigKey:
      type: object
      required:
        - root
        - tenant
        - platform-config-key
      properties:
        root:
          type: string
          enum: [platform]
        tenant:
          type: string
          example: digdir
        node-id:
          type: string
        platform-config-key:
          type: string
          example: default

    RuntimeAllowedConfigKey:
      type: object
      required:
        - root
        - tenant
        - runtime-config-key
      properties:
        root:
          type: string
          enum: [runtime]
        tenant:
          type: string
          example: digdir
        node-id:
          type: string
        runtime-config-key:
          type: string
          example: default

    DatasetAllowedConfigKey:
      type: object
      required:
        - root
        - tenant
        - dataset-config-key
      properties:
        root:
          type: string
          enum: [dataset]
        tenant:
          type: string
          example: digdir
        node-id:
          type: string
        dataset-config-key:
          type: string
          example: public-docs

    PublicDatasetSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled?:
          type: boolean
        status:
          type: string

    OperatorPipelineSummary:
      type: object
      properties:
        id:
          type: string
        datasetId:
          type: string
        name:
          type: string
        sourceType:
          type: string
          nullable: true
        enabled?:
          type: boolean
        nameAmbiguous:
          type: boolean
          description: |
            Present and true only when the effective name could not be
            resolved unambiguously. Absent otherwise.
        sourceTypeAmbiguous:
          type: boolean
          description: |
            Present and true only when the effective source type could not
            be resolved unambiguously. Absent otherwise.

    OperatorDatasetSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled?:
          type: boolean
        pipelineCount:
          type: integer
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/OperatorPipelineSummary'

    CreatePipelineRequest:
      type: object
      required:
        - tenant
        - dataset-config-key
        - pipeline-name
      properties:
        tenant:
          type: string
        dataset-config-key:
          type: string
        pipeline-name:
          type: string
          description: Child materialization pipeline name
        properties:
          type: object
          additionalProperties: true

    UpdatePipelineRequest:
      type: object
      description: |
        `properties` is optional — the schema accepts an empty body, and the
        spec previously marked it required (#177).
      properties:
        properties:
          type: object
          additionalProperties: true

    # Response Schemas
    # RagResponse, RetrieveResponse, ChunkBasic, and ChunkDetailed were
    # removed alongside /api/rag and /api/retrieve in Phase 0 of the MCP
    # migration. MCP tool-call result shapes are described in
    # endpoints/mcp.md.

    ConversationListResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        total:
          type: integer
        pageSize:
          type: integer
        pageIndex:
          type: integer

    Conversation:
      type: object
      properties:
        id:
          type: string
        topic:
          type: string
        agentId:
          type: string
        userId:
          type: string
          description: Opaque external caller identifier used only for public API conversation scoping
        tags:
          type: array
          items:
            type: string
        created:
          type: integer
          description: Unix timestamp

    ConversationWithMessages:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    Message:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        role:
          type: string
          enum: [user, assistant]
        tags:
          type: array
          items:
            type: string
        created:
          type: integer
        diagnostics:
          type: object
          additionalProperties: true
          description: Optional normalized diagnostics for messages that were persisted with diagnostics and requested with include_diagnostics=true

    ApiKeyListResponse:
      type: object
      properties:
        api-keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyInfo'

    ApiKeyInfo:
      # Shape taken from `public-api-key` (api/routes/handlers.clj) by calling it
      # and reading the result, not from a neighbouring schema. It previously
      # declared `id`, which no handler emits — the producer emits `api-key-id`
      # — and omitted eight fields it does emit, including `modes`, the grant
      # field #167 renamed at this boundary (#201).
      #
      # Credential material is deliberately absent. Only non-secret display
      # fragments are returned after the one-time creation response.
      type: object
      properties:
        api-key-id:
          type: string
        key-prefix:
          type: string
          nullable: true
          description: Non-secret leading characters used to identify the key.
        key-last-four:
          type: string
          nullable: true
          description: Non-secret final four characters used to identify the key.
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        modes:
          # The skill-graph grant. Named `modes` on the wire (#167) while the
          # stored attribute remains :api-key/skill-graphs.
          type: array
          items:
            type: string
        agent-refs:
          # Agent ids, as strings. `public-api-key` passes this through
          # unchanged because the projection has already happened upstream:
          # `normalize-key-entity` maps :api-key.agent-ref/agent-id out of each
          # stored ref before the handler ever sees it.
          type: array
          items:
            type: string
        dataset-scopes:
          type: array
          items:
            $ref: '#/components/schemas/DatasetScope'
        allowed-config-keys:
          type: array
          items:
            $ref: '#/components/schemas/AllowedConfigKey'
        client-id:
          # First entry of the stored clients vector, so null when none is set.
          type: string
          nullable: true
        policy-id:
          type: string
          description: |
            Present only when the key is bound to an access policy — the
            producer adds it through a cond->. Absent otherwise.
        usage-count:
          type: integer
        created:
          type: integer
        created-by:
          type: string
        last-used:
          type: integer
          nullable: true
        expires-at:
          type: integer
          nullable: true
        revoked:
          type: boolean

    CreateApiKeyResponse:
      type: object
      properties:
        api-key-id:
          type: string
        api-key:
          type: string
          description: The actual API key (only shown once)
        name:
          type: string
        dataset-scopes:
          type: array
          items:
            $ref: '#/components/schemas/DatasetScope'
        allowed-config-keys:
          type: array
          items:
            $ref: '#/components/schemas/AllowedConfigKey'
        client-id:
          type: string
        agent-refs:
          type: array
          items:
            type: string
        modes:
          type: array
          description: >-
            Namespaced mode ids this key may invoke,
            e.g. `builtin/agent-rag-graph-bundled`.
          items:
            type: string
        warning:
          type: string
          description: Reminder to store the key securely

    ApiKeyAllowedConfigKeysResponse:
      type: object
      properties:
        api-key-id:
          type: string
        name:
          type: string
        allowed-config-keys:
          type: array
          items:
            $ref: '#/components/schemas/AllowedConfigKey'

    PublicDatasetListResponse:
      type: object
      properties:
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/PublicDatasetSummary'

    PublicDatasetResponse:
      type: object
      properties:
        dataset:
          $ref: '#/components/schemas/PublicDatasetSummary'

    OperatorDatasetListResponse:
      type: object
      properties:
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/OperatorDatasetSummary'

    OperatorPipelineListResponse:
      type: object
      description: |
        Response of `GET /console-api/datasets/{datasetId}/pipelines`.
        Referenced since the spec was written but never defined, which
        made the document fail strict validation.
      properties:
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/OperatorPipelineSummary'

    OperatorDatasetResponse:
      type: object
      properties:
        dataset:
          $ref: '#/components/schemas/OperatorDatasetSummary'

    OperatorDatasetCreatedResponse:
      type: object
      properties:
        datasetId:
          type: string
        dataset:
          $ref: '#/components/schemas/OperatorDatasetSummary'

    Pipeline:
      # Shape verified against get-pipeline-handler (api/routes/datasets.clj),
      # not against the neighbouring schemas. The handler starts from
      # pipeline/get-dataset, then explicitly assoc's dataset-config-key and
      # execution-pipeline-id and explicitly dissoc's tenant-config-key and id —
      # so `id` is NOT part of this response despite having been advertised.
      #
      # additionalProperties stays true on purpose: the remaining fields are the
      # resolved dataset/materialization properties, which are data-driven
      # (config-db/get-dataset builds them from the property paths defined in the
      # config tree) and so cannot be enumerated here without going stale.
      type: object
      additionalProperties: true
      properties:
        tenant:
          type: string
        pipeline-name:
          type: string
        dataset-config-key:
          type: string
        execution-pipeline-id:
          type: string

    PipelineDetailResponse:
      type: object
      properties:
        pipeline:
          $ref: '#/components/schemas/Pipeline'

    PipelineCreatedResponse:
      type: object
      properties:
        pipeline-name:
          type: string
        execution-pipeline-id:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    ExecutionStartedResponse:
      type: object
      properties:
        executionId:
          type: string

    PipelineExecution:
      type: object
      description: |
        One row of the console executions endpoint. Nullability read off
        list-executions-handler: everything but id, execution-pipeline-id,
        status and startedAt is passed straight from the execution record
        and serialises as null when unset.
      properties:
        id:
          type: string
        execution-pipeline-id:
          type: string
        status:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
          nullable: true
        documentsProcessed:
          type: integer
          nullable: true
        documentsFailed:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true
        startedBy:
          type: string
          nullable: true

    PipelineExecutionListResponse:
      type: object
      properties:
        executions:
          type: array
          items:
            $ref: '#/components/schemas/PipelineExecution'

    RuntimeConfigResolveResponse:
      # Shape read from resolve-runtime-config-handler (api/routes/datasets.clj),
      # not from the dataset variant below — the two differ, and assuming
      # symmetry is what #145 got wrong.
      type: object
      properties:
        root:
          type: string
          example: runtime
        tenant:
          type: string
        runtime-config-key:
          type: string
        config:
          # The resolved values themselves. Keys are config property paths from
          # the config tree, so they are data-driven and cannot be enumerated
          # here without going stale.
          type: object
          additionalProperties: true
        traces:
          # Per-path resolution traces, keyed the same data-driven way.
          type: object
          additionalProperties: true
        authorization:
          type: object
          properties:
            allowed:
              type: boolean
            matched-allowed-config-key:
              type: string
              nullable: true
        compatibility:
          type: object
          properties:
            status:
              type: string
              example: ok
            checked-on-node:
              type: string
            agent-id:
              type: string
              nullable: true
            dataset-id:
              type: string
              description: |
                Present only when the request selected a dataset. Absent
                otherwise — the handler adds it through a cond->.
        node:
          type: object
          properties:
            node-id:
              type: string
            runtime-config-key:
              type: string

    DatasetConfigResolveResponse:
      # Read from resolve-dataset-config-handler. Note the differences from the
      # runtime variant: dataset-config-key rather than runtime-config-key, and
      # compatibility.dataset-id is unconditional here.
      type: object
      properties:
        root:
          type: string
          example: dataset
        tenant:
          type: string
        dataset-config-key:
          type: string
        config:
          type: object
          additionalProperties: true
        traces:
          type: object
          additionalProperties: true
        authorization:
          type: object
          properties:
            allowed:
              type: boolean
            matched-allowed-config-key:
              type: string
              nullable: true
        compatibility:
          type: object
          properties:
            status:
              type: string
              example: ok
            checked-on-node:
              type: string
            dataset-id:
              type: string
              nullable: true
        node:
          type: object
          properties:
            node-id:
              type: string
            dataset-config-key:
              type: string

    SkillExecutionResponse:
      # execute-skill-handler wraps whatever the skill returned in `result`.
      # That inner shape is per-skill and defined by the skill itself, so it is
      # declared open rather than described — a schema promising a fixed shape
      # here would be false for every skill but one.
      type: object
      properties:
        result:
          type: object
          additionalProperties: true

    User:
      type: object
      description: An operator-console user with the permissions granted to them.
      properties:
        id:
          type: string
        email:
          type: string
        created:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    Permission:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    PermissionListResponse:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    AccessPolicy:
      type: object
      description: >-
        A named grant that API keys can be bound to. `modes` is the
        skill-graph grant; it carries that name in both request and response
        (`digdir.api.routes.handlers/public-modes-field`).
      properties:
        policy-id:
          type: string
        name:
          type: string
        created:
          type: string
          format: date-time
        created-by:
          type: string
        tenants:
          type: array
          items:
            type: string
        clients:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        modes:
          type: array
          items:
            type: string
        dataset-scopes:
          type: array
          items:
            $ref: '#/components/schemas/DatasetScope'
        agent-refs:
          type: array
          items:
            type: string

    AccessPolicyListResponse:
      type: object
      properties:
        access-policies:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicy'

    DeletedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User deleted

    RotateApiKeyResponse:
      description: >-
        The rotated key's metadata plus the new plaintext, which is returned
        only in this response and cannot be retrieved again.
      allOf:
        - $ref: '#/components/schemas/ApiKeyInfo'
        - type: object
          properties:
            api-key:
              type: string
              description: The new API key. Shown once.
            warning:
              type: string

    UserResponse:
      # Emitted identically by create-user-handler (201) and
      # update-user-permissions-handler (200); both build this map explicitly.
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            created:
              type: string
              format: date-time
            permissions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Missing required field: query"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Invalid or missing API key"

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Resource not found"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"
