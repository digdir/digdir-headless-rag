            application/json:
              schema:
                $ref: '#/components/schemas/OperatorDatasetListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Pipelines
      summary: Create Dataset
      description: Create a durable parent dataset for the Operator Console.
      operationId: createOperatorDataset
      security:
        - JwtAuth: []
      parameters:
        - name: X-User-Email
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetRequest'
      responses:
        '201':
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorDatasetCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /console-api/datasets/{dataset-id}:
    parameters:
      - name: dataset-id
        in: path
        required: true
        description: Canonical globally unique dataset ID
        schema:
          type: string
    get:
      tags:
        - Pipelines
      summary: Get Dataset
      description: Return one dataset and its child pipeline summaries.
      operationId: getOperatorDataset
      security:
        - JwtAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorDatasetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Pipelines
      summary: Update Dataset
