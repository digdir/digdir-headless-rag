name: digdir-rag-e2e

services:
  digdir-rag:
    # The dev server image. Built from this repo's Dockerfile or pulled
    # if already cached. Listens on port 8080 inside the network.
    #
    # E2E_API_KEY triggers boot-time auto-seed in
    # digdir.e2e.seed/maybe-seed! — built-in agents land in the DB and
    # an API key with this exact plaintext is stored, so Open WebUI can
    # reach /api/mcp, /v1 and /api/tools without an out-of-band seed step.
    build:
      context: ../..
      dockerfile: server.Dockerfile
    image: digdir-rag-server:e2e
    container_name: digdir-rag-e2e
    env_file:
      - .env
    environment:
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      DATAHIKE_FILE_PATH: /var/lib/digdir/db
      DIGDIR_RAG_DEBUG: ${DIGDIR_RAG_DEBUG:-false}
      # E2E-only debug scaffolds. The first flag enables
      # /api/debug/last-invocation + /api/debug/agent-resolution
      # (both are no-ops in production where it stays unset). The
      # second is the X-Debug-Api-Key value Playwright sends to read
      # those endpoints. Defaults are safe for local; override in .env.
      DIGDIR_DEBUG_LAST_INVOCATION: ${DIGDIR_DEBUG_LAST_INVOCATION:-true}
      RAG_DEBUG_API_KEY: ${RAG_DEBUG_API_KEY:-e2e-debug-key}
    volumes:
      - digdir-db:/var/lib/digdir
    ports:
      - "8080:8080"
    healthcheck:
      # ⚠️ NOT `/up`, and the reason is the whole point of this file's history.
      #
      # `/up` answers as soon as Jetty is listening — before the skills registry
      # is initialised. `depends_on: service_healthy` then releases Open WebUI,
      # whose first fetch of the tool document hits a cold `list-tools`, times
      # out against its default tool-server timeout, and logs
      # `Initialized 0 tool server(s)`. Observed exactly that. It recovers on a
      # later fetch, so the stack works — it just greets a newcomer with an
      # ERROR line and a briefly empty tool list.
      #
      # This is the same defect as MCPO's old healthcheck, which GET'd a page
      # that returned 200 with nothing behind it: a check that passes before
      # the thing it gates is ready. So check the surface the dependent
      # actually needs. Warm, this endpoint answers in ~65ms.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null
          -H "Authorization: Bearer $$E2E_API_KEY"
          http://localhost:8080/api/tools/openapi.json
      interval: 5s
      timeout: 10s
      retries: 30

  # ⚠️ THE `mcpo` SERVICE IS GONE, DELIBERATELY — do not add it back.
  #
  # MCPO bridged MCP -> OpenAPI so Open WebUI could tool-call our agents. It
  # cannot do that any more: it opens with `initialize`, and this server
  # implements MCP 2026-07-28, which has no handshake. That is not fixable by
  # bumping its SDK (measured — see README.md, "What fixing MCPO would take")
  # and MCPO has had no commit since 2026-02-27.
  #
  # The bridge existed only because the translation had to happen SOMEWHERE.
  # We own the server, so it happens here: /api/tools/openapi.json renders the
  # same (agent, mode) tools as OpenAPI directly. One less container, one less
  # unmaintained dependency, and no protocol-era problem to inherit.

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.11.3
    container_name: digdir-rag-openwebui-e2e
    depends_on:
      digdir-rag:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Agents as TOOLS — the surface MCPO used to provide, served by the
      # backend itself. `config.enable` is required: Open WebUI's
      # `get_tool_servers_data` skips a connection without it and reports an
      # empty tool list with nothing logged.
      TOOL_SERVER_CONNECTIONS: '[{"url":"http://digdir-rag:8080","path":"/api/tools/openapi.json","type":"openapi","auth_type":"bearer","key":"${E2E_API_KEY}","config":{"enable":true},"info":{"id":"digdir-rag","name":"digdir-rag"}}]'
      # Agents as MODELS — the other half, unchanged.
      OPENAI_API_BASE_URLS: "http://digdir-rag:8080/v1"
      OPENAI_API_KEYS: "${E2E_API_KEY}"
      # Nothing here runs Ollama; probing for it just slows the first paint.
      ENABLE_OLLAMA_API: "false"
      # Disable the LLM auth flow for the deterministic test run.
      WEBUI_AUTH: "false"
    ports:
      # Host 3030 instead of 3000 — 3000 commonly collides with local
      # node dev servers. Override via OPENWEBUI_PORT env in .env if
      # 3030 is also taken.
      - "${OPENWEBUI_PORT:-3030}:8080"
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  digdir-db:
  open-webui-data:
