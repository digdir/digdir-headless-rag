name: digdir-rag-host

# Slim Open WebUI stack pointed at a bb dev running on the HOST machine
# (default localhost:8181) instead of building a fresh digdir-rag container.
# Useful when you want to exercise the live, in-development backend through
# Open WebUI — same Typesense, same ColBERT, same datahike file, same
# runtime-config toggles you've set locally — without rebuilding the
# digdir-rag image on every code change.
#
# Prereq:
#   1. bb dev running with E2E_API_KEY env var matching server/e2e/.env's
#      E2E_API_KEY (so digdir.e2e.seed/maybe-seed! stores the API key Open
#      WebUI will use for both surfaces below).
#   2. server/e2e/.env present (copy .env.example and fill in E2E_API_KEY).

services:
  # ⚠️ THE `mcpo` SERVICE IS GONE — see docker-compose.e2e.yml for why. Both
  # surfaces below now come straight from the host's `bb dev`, so this stack is
  # a single container.

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.11.3
    container_name: digdir-rag-openwebui-host
    env_file:
      - .env
    environment:
      # Agents as MODELS. OWUI fetches /v1/models on boot and populates the
      # "Select a model" dropdown — no manual Settings click required.
      OPENAI_API_BASE_URLS: "http://host.docker.internal:8181/v1"
      OPENAI_API_KEYS: "${E2E_API_KEY}"
      # Agents as TOOLS, for tool-calling instead of agent-as-model. Both work
      # side by side. This used to require the MCPO container; the backend now
      # renders the same tools as OpenAPI itself.
      TOOL_SERVER_CONNECTIONS: '[{"url":"http://host.docker.internal:8181","path":"/api/tools/openapi.json","type":"openapi","auth_type":"bearer","key":"${E2E_API_KEY}","config":{"enable":true},"info":{"id":"digdir-rag","name":"digdir-rag"}}]'
      ENABLE_OLLAMA_API: "false"
      # Disable auth for local dev. Don't expose this port to a network
      # you don't trust.
      WEBUI_AUTH: "false"
    extra_hosts:
      # Required for host.docker.internal to resolve on Linux Docker.
      # Docker Desktop on macOS/Windows resolves it natively; the
      # mapping is a no-op there. It moved here from the deleted mcpo
      # service — this is the container that needs it now.
      - "host.docker.internal:host-gateway"
    ports:
      # Default 3030 host port to avoid the common 3000 collision.
      # Override with OPENWEBUI_PORT=... in .env if 3030 is also taken.
      - "${OPENWEBUI_PORT:-3030}:8080"
    volumes:
      - open-webui-data-host:/app/backend/data

volumes:
  open-webui-data-host:
