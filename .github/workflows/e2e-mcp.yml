name: E2E — MCP + Open WebUI stack

# WHY THIS IS A SEPARATE WORKFLOW, AND WHY IT IS NOT ON THE SELF-HOSTED RUNNER.
#
# `ci.yml` runs entirely on the single self-hosted runner, whose container
# **deliberately does not mount the docker socket** — infra/ci-runner/README.md:
# "Mounting it would let workflow code reach the production containers." This
# suite brings up three containers, so it cannot run there at all. That is a
# design decision to route around, not an oversight to fix.
#
# So it runs on ubuntu-latest, the same escape hatch ci-fallback-canary.yml
# already uses.
#
# WHAT IT GUARDS, and why it exists at all:
#
# The Open WebUI demo broke on 2026-08-21, when MCP moved to revision
# 2026-07-28 (modern-only, no `initialize` handshake), and nobody noticed for
# 11 days. The test that catches it was already written and already correct —
# `server/e2e/playwright/tests/00-stack-up.spec.ts`. It had simply never been
# invoked by anything: `bb e2e:*` is outside `bb test`, and the nightly job the
# e2e README pointed at was still written in the conditional. **The defect was
# an uninvoked detector, not a missing one.** This file invokes it.
#
# ⚠️ NOT REQUIRED FOR MERGE, deliberately, and NOT `continue-on-error` —
# the same reasoning `ci.yml` records for `build-client`. Branch protection
# requires `lint-and-test` only. A new check's early reds are disproportionately
# its own defects, and that is better found by a red that does not stop eight
# lanes. `continue-on-error` would instead HIDE genuine failures, which is the
# opposite of what a new check needs.

on:
  workflow_dispatch:
  schedule:
    # Daily, 03:47 UTC. Off-hours and deliberately not on the hour.
    - cron: '47 3 * * *'
  pull_request:
    # Path-filtered on purpose: this job builds an uberjar and pulls three
    # images, so running it on every PR would be a poor trade. These are the
    # paths whose changes can break the chain — the MCP surface itself, the
    # /v1 surface Open WebUI attaches to, the boot-time seed that supplies the
    # API key, and the stack definitions.
    paths:
      - 'server/src/digdir/mcp/**'
      - 'server/src/digdir/e2e/**'
      - 'server/src/digdir/api/routes/endpoints/openai_compat.clj'
      - 'server/src/digdir/api/routes/endpoints.clj'
      - 'server/e2e/**'
      - 'docker-compose.newcomer.yml'
      - 'server.Dockerfile'
      - '.github/workflows/e2e-mcp.yml'

concurrency:
  group: e2e-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-stack:
    runs-on: ubuntu-latest
    # Cold: an uberjar build (including the shadow-cljs client) plus three
    # image pulls plus a browser download. Generous on purpose — a timeout
    # here reads as a product failure and costs someone an investigation.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise-pinned toolchain
        uses: jdx/mise-action@v4

      # server/e2e/.env is gitignored and is the single definition of this
      # stack: digdir-rag reads it via env_file, MCPO substitutes E2E_API_KEY
      # into its config, and the Playwright specs read the same key back out
      # of it. The committed example is complete apart from AZURE_OPENAI_API_KEY,
      # which only the (skipped) happy-path spec needs.
      - name: Create the e2e .env from the tracked example
        run: cp server/e2e/.env.example server/e2e/.env

      # `bb e2e:up` picks `docker compose` or `docker-compose` by probing,
      # because which one exists is a property of the machine (see bb.edn's
      # :init). ubuntu-latest has the plugin; a Homebrew laptop has the binary.
      - name: Bring the stack up
        run: bb e2e:up

      - name: Install Playwright deps
        working-directory: server/e2e/playwright
        # `npm install`, not `npm ci` — there is no committed lockfile.
        run: npm install

      - name: Install Chromium
        run: bb e2e:install-browsers

      - name: Run the E2E suite
        run: bb e2e:test

      # Container logs are the only way to tell "our server rejected it" from
      # "the client never connected", and that distinction is exactly what took
      # a manual investigation to establish last time. Capture them on failure
      # rather than asking the next person to reproduce locally.
      - name: Dump container logs
        if: failure()
        run: |
          for c in digdir-rag-e2e digdir-rag-mcpo-e2e digdir-rag-openwebui-e2e; do
            echo "::group::$c"
            docker logs "$c" 2>&1 | tail -200 || echo "(no such container)"
            echo "::endgroup::"
          done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: server/e2e/playwright/playwright-report/
          retention-days: 7

      - name: Tear the stack down
        if: always()
        run: bb e2e:down
