name: E2E — MCP / Open WebUI chain, and a real ingest against a STUB LLM (no cloud LLM call)

# WHY THIS IS A SEPARATE WORKFLOW.
#
# It needs to bring up three containers. It was split out because `ci.yml` then
# ran on the self-hosted runner, whose container **deliberately does not mount
# the docker socket** — infra/ci-runner/README.md: "Mounting it would let
# workflow code reach the production containers" — so this suite could not run
# there at all.
#
# ci.yml is on ubuntu-latest now, so that constraint is gone and the two COULD
# be merged. Kept separate deliberately: this suite pulls images and starts a
# stack, which is a different cost and a different failure mode from lint and
# unit tests, and folding it in would make every PR pay for it.
#
# WHAT IT GUARDS, and why it exists at all:
#
# The Open WebUI demo broke on 2026-08-21, when MCP moved to revision
# 2026-07-28 (modern-only, no `initialize` handshake), and nobody noticed for
# 11 days. The test that catches it was already written and already correct —
# `server/e2e/playwright/tests/00-stack-up.spec.ts`. It had simply never been
# invoked by anything: `bb e2e:*` is outside `bb test`, and the nightly job the
# e2e README pointed at was still written in the conditional. **The defect was
# an uninvoked detector, not a missing one.** This file invokes it.
#
# WHAT A GREEN RUN DOES AND DOES NOT PROVE - read this before reading a green
# result as "the stack works". Two jobs, and they prove different things.
#
# `e2e-stack`: the MCP / Open WebUI stack BOOTS and the chain answers.
# It ingests nothing and makes no LLM call:
#   - server/e2e/docker-compose.e2e.yml has no Typesense and mounts no corpus;
#   - its tracked .env.example ships AZURE_OPENAI_API_KEY empty and this workflow
#     injects no secret, so the one spec that calls an LLM, 10-tool-invocation,
#     skips itself.
#
# `e2e-ingest`: a REAL ingest, in the SHIPPED newcomer compose plus
# server/e2e/ingest/compose.override.yml. That override is only the COMPOSE
# half of how it differs from a newcomer; the complete list (the debug and
# login flags in ingest.env, the embedding-model download issue pre-warm, the HTTP login and trigger) is
# in server/e2e/README.md. It asserts:
#   - an exact document count, read twice (the product's report and Typesense's);
#   - what the LLM stub was actually sent - model, json_schema and the
#     CONFIGURED key by hash (Phase 3 of the provider-resolver change's routing, openai-compatible branch);
#   - a cache re-run with zero calls, with a positive control that re-asks once
#     the run's cache is wiped;
#   - retrieval relevance at TOP-1: two queries, each with one right answer,
#     each ranking its own document first;
#   - the documented no-key Azure refusal;
#   - the STAGED STORE, the mission's done-condition: "A REAL migration,
#     run against a STAGED store, exported and restored into a fresh install,
#     with a query working afterwards." The migration, the export and the import
#     are real; THE STARTING STATE IS CONSTRUCTED BY US.
# It does NOT prove: any real model's behaviour, the Azure happy path, ranking
# beyond top-1 on four documents, the demo corpus or its committed warm cache,
# the agent loop, MCP, the admin UI's own door (it drives the console HTTP
# route to the same executor), upgrades, that a REAL deployment's backup
# restores (the staged store tests the failure we know about, on a store we
# built to contain it), a restore under another master key, or a restore that
# fails half-way.
#
# Neither job makes a CLOUD LLM call. That is what the name's last clause says.
#
# ⚠️ NOT REQUIRED FOR MERGE, deliberately, and NOT `continue-on-error` —
# the same reasoning `ci.yml` records for `build-client`. Branch protection
# requires `lint-and-test` only. A new check's early reds are disproportionately
# its own defects, and that is better found by a red that does not stop eight
# lanes. `continue-on-error` would instead HIDE genuine failures, which is the
# opposite of what a new check needs.

on:
  workflow_dispatch:
  schedule:
    # Daily, 03:47 UTC. Off-hours and deliberately not on the hour.
    - cron: '47 3 * * *'
  pull_request:
    # Path-filtered on purpose: this job builds an uberjar and pulls three
    # images, so running it on every PR would be a poor trade. These are the
    # paths whose changes can break the chain — the MCP surface itself, the
    # /v1 surface Open WebUI attaches to, the boot-time seed that supplies the
    # API key, and the stack definitions.
    paths:
      - 'server/src/digdir/mcp/**'
      - 'server/src/digdir/e2e/**'
      - 'server/src/digdir/api/routes/endpoints/openai_compat.clj'
      - 'server/src/digdir/api/routes/endpoints.clj'
      - 'server/e2e/**'
      - 'docker-compose.newcomer.yml'
      # The ingest check covers these too: the loader, the pipeline,
      # phrase generation and its cache, LLM routing, config and its env bridge,
      # the setup mains the README runs, the boot, and the committed warm cache.
      # Both jobs run on any of them - a path filter is per workflow.
      - 'server/src/digdir/docs/**'
      - 'server/src/digdir/pipeline/**'
      - 'server/src/digdir/llm/**'
      - 'server/src/digdir/config/**'
      - 'server/src/digdir/setup/**'
      - 'server/src/digdir/boot/**'
      - 'server/src-prod/**'
      - 'server/resources/demo-corpus/**'
      # ...and the code the ingest job's LOGIN, TRIGGER and QUERY drive, which
      # a retrieval or dependency PR would otherwise meet only in the nightly
      # run (checked with a path matcher).
      - 'server/src/digdir/rag/**'
      - 'server/src/digdir/skills/builtin/retrieval.clj'
      - 'server/src/digdir/skills/builtin/query_planner.clj'
      - 'server/src/digdir/api/routes.clj'
      - 'server/src/digdir/api/routes/endpoints/debug.clj'
      - 'server/src/digdir/api/http.clj'
      - 'server/src/digdir/auth/**'
      - 'server/deps.edn'
      # ...and what the staged store drives: the real export and import,
      # boot's prepare-store!, and the round-trip audit it mounts from the tests.
      - 'server/src/digdir/import_export/**'
      - 'server/src/digdir/data/**'
      - 'server/test/digdir/config/round_trip.clj'
      - 'server.Dockerfile'
      - '.github/workflows/e2e-mcp.yml'

concurrency:
  group: e2e-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs check out code and upload artifacts, which need no write access.
permissions:
  contents: read

jobs:
  e2e-stack:
    runs-on: ubuntu-latest
    # Cold: an uberjar build (including the shadow-cljs client) plus three
    # image pulls plus a browser download. Generous on purpose — a timeout
    # here reads as a product failure and costs someone an investigation.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise-pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # server/e2e/.env is gitignored and is the single definition of this
      # stack: digdir-rag reads it via env_file, MCPO substitutes E2E_API_KEY
      # into its config, and the Playwright specs read the same key back out
      # of it. The committed example is complete apart from AZURE_OPENAI_API_KEY,
      # which only the (skipped) happy-path spec needs.
      - name: Create the e2e .env from the tracked example
        run: cp server/e2e/.env.example server/e2e/.env

      # `bb e2e:up` picks `docker compose` or `docker-compose` by probing,
      # because which one exists is a property of the machine (see bb.edn's
      # :init). ubuntu-latest has the plugin; a Homebrew laptop has the binary.
      - name: Bring the stack up
        run: bb e2e:up

      - name: Install Playwright deps
        working-directory: server/e2e/playwright
        # `npm install`, not `npm ci` — there is no committed lockfile.
        run: npm install

      - name: Install Chromium
        run: bb e2e:install-browsers

      - name: Run the E2E suite
        run: bb e2e:test

      # Container logs are the only way to tell "our server rejected it" from
      # "the client never connected", and that distinction is exactly what took
      # a manual investigation to establish last time. Capture them on failure
      # rather than asking the next person to reproduce locally.
      - name: Dump container logs
        if: failure()
        run: |
          for c in digdir-rag-e2e digdir-rag-mcpo-e2e digdir-rag-openwebui-e2e; do
            echo "::group::$c"
            docker logs "$c" 2>&1 | tail -200 || echo "(no such container)"
            echo "::endgroup::"
          done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: server/e2e/playwright/playwright-report/
          retention-days: 7

      - name: Tear the stack down
        if: always()
        run: bb e2e:down

  e2e-ingest:
    runs-on: ubuntu-latest
    # The harness makes the compose project unique per run unless it is pinned.
    # Pinned here so the teardown step below can name it; a runner is one job,
    # so there is nothing to collide with.
    env:
      INGEST_PROJECT: digdir-rag-ingest-ci
    # Cold: an uberjar build, two image pulls and Typesense's 128 MB embedding
    # model download, then three scenarios on fresh volumes each (the staged
    # store brings up two stacks in turn). Generous for the same reason as
    # e2e-stack: a timeout reads as a product failure.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise-pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # Everything is in the harness: build, all three scenarios, their assertions,
      # and - on failure - the container logs, printed BEFORE teardown, because
      # the harness tears each scenario's stack down itself. No .env step: the
      # stack reads server/e2e/ingest/ingest.env (test values), never a root .env.
      - name: Run the ingest check
        run: bb e2e:ingest

      # Every scenario's FULL server log, pass or fail. The harness counts
      # known ERROR-level signals in them, and a count is only evidence
      # because the whole log is kept.
      #
      # ⚠️ Both settings below are load-bearing, and the first CI run
      # shipped without them: `.logs` is a hidden directory, upload-artifact@v4
      # skips hidden files by default, and its default `if-no-files-found: warn`
      # left the step GREEN while it uploaded nothing. `error` makes a missing
      # upload a red step instead of a warning nobody reads.
      - name: Upload the ingest server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ingest-server-logs
          path: server/e2e/ingest/.logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Belt and braces: the harness downs each stack, but a cancelled run or a
      # harness crash could leave one up on a reused runner.
      - name: Tear the ingest stack down
        if: always()
        run: >-
          docker compose -p "$INGEST_PROJECT"
          --env-file server/e2e/ingest/ingest.env
          -f docker-compose.newcomer.yml
          -f server/e2e/ingest/compose.override.yml
          down -v --remove-orphans || true
        env:
          INGEST_AZURE_OPENAI_USE_AZURE: "false"
